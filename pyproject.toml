[project]
name = "bottled-kiwix"
version = "0.1.0"
description = "Kiwix offline content server and library manager for Cloud in a Bottle"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "litestar>=2.12",
    "hypercorn>=0.17",
    "attrs>=24.0",
    "httpx>=0.27",
    "loguru>=0.7.3",
    "defusedxml>=0.7.1",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "playwright",
    "types-defusedxml>=0.7.0.20260504",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kiwix_manager"]

[tool.pytest.ini_options]
addopts = "-v"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "I", "PLC0415"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["kiwix_manager"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
packages = ["kiwix_manager"]
strict = true
ignore_missing_imports = true
